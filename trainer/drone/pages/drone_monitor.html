<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV 突防回放系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 12px 24px; border-radius: 12px; display: none; align-items: center; gap: 16px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; }
        #controls button { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
        #controls button:hover { background: rgba(56, 189, 248, 0.2); }
        #controls input[type="range"] { width: 300px; }
        #file-btn { position: absolute; top: 20px; right: 20px; z-index: 20; padding: 8px 16px; background: #0ea5e9; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #file-btn:hover { background: #0284c7; }
        #file-input { display: none; }
        #log { position: absolute; bottom: 100px; left: 20px; z-index: 20; background: rgba(0,0,0,0.7); color: #0f0; padding: 8px; font-size: 12px; max-height: 150px; overflow-y: auto; width: 300px; border-radius: 4px; font-family: monospace; display: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <button id="file-btn">📂 加载 JSON</button>
    <input type="file" id="file-input" accept=".json">
    <div id="controls">
        <button id="play-btn">▶</button>
        <button id="reset-btn">⏮</button>
        <span id="step-label">0 / 0</span>
        <input type="range" id="timeline" min="0" max="0" value="0">
        <select id="speed-select"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option></select>
        <span id="frame-info">步数: 0</span>
    </div>
    <div id="log"></div>

    <script>
        // =============================================
        // 1. Three.js 场景初始化
        // =============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(120, 80, 120);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0, 0);
        controls.update();

        // 灯光
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // ---- 坐标轴 ----
        const axesHelper = new THREE.AxesHelper(80);
        scene.add(axesHelper);

        // ---- 地面网格 ----
        const gridHelper = new THREE.GridHelper(400, 20, 0x1e293b, 0x1e293b);
        gridHelper.position.y = -0.1;
        scene.add(gridHelper);

        // ---- 动态实体容器 ----
        const entityGroup = new THREE.Group();
        scene.add(entityGroup);

        const bulletGroup = new THREE.Group();
        scene.add(bulletGroup);

        // ---- 工具函数 ----
        function clearEntities() {
            while(entityGroup.children.length) {
                const child = entityGroup.children[0];
                entityGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
            while(bulletGroup.children.length) {
                const child = bulletGroup.children[0];
                bulletGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
        }

        // ---- 创建无人机 ----
        function createDrone(pos, color, label) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.SphereGeometry(2, 8, 8),
                new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.3 })
            );
            g.add(body);
            for (let i=0; i<4; i++) {
                const prop = new THREE.Mesh(
                    new THREE.BoxGeometry(3, 0.1, 0.3),
                    new THREE.MeshStandardMaterial({ color: 0xffffff })
                );
                const angle = i * Math.PI / 2;
                prop.position.set(Math.cos(angle)*2.2, 1.5, Math.sin(angle)*2.2);
                prop.userData.rotSpeed = 0.2 + Math.random()*0.1;
                g.add(prop);
            }
            g.position.copy(pos);
            entityGroup.add(g);
            return g;
        }

        // ---- 创建武器（整体化，无散落） ----
        function createWeapon(pos, aimPos) {
            const g = new THREE.Group();

            // ---- 武器主体 ----
            // 底座
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(3, 4, 1.5, 8),
                new THREE.MeshStandardMaterial({
                    color: 0xf59e0b,
                    emissive: 0xd97706,
                    emissiveIntensity: 0.1
                })
            );
            base.position.set(0, 0.8, 0);
            g.add(base);

            // 炮塔（球体）
            const turret = new THREE.Mesh(
                new THREE.SphereGeometry(2, 8, 8),
                new THREE.MeshStandardMaterial({
                    color: 0xf59e0b,
                    emissive: 0xd97706,
                    emissiveIntensity: 0.05
                })
            );
            turret.position.set(0, 2.2, 0);
            g.add(turret);

            // 炮管
            const barrel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.6, 4, 6),
                new THREE.MeshStandardMaterial({
                    color: 0x475569,
                    metalness: 0.9,
                    roughness: 0.2
                })
            );
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 2.2, 3);
            g.add(barrel);

            // 设置武器位置
            g.position.copy(pos);
            entityGroup.add(g);

            // ---- 红色瞄准线（固定长度 30，只旋转不伸缩） ----
            if (aimPos) {
                const start = pos.clone();

                // 计算从武器到瞄准点的方向向量（归一化）
                const direction = new THREE.Vector3()
                    .copy(aimPos)
                    .sub(pos);

                // 如果方向向量长度不为零，归一化
                if (direction.length() > 0.001) {
                    direction.normalize();
                } else {
                    // 如果方向为零向量，默认指向 Z 正方向
                    direction.set(0, 0, 1);
                }

                // 固定长度 30
                const fixedLength = 30;
                const end = pos.clone().add(direction.multiplyScalar(fixedLength));

                // 红色瞄准线
                const lineGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
                const lineMat = new THREE.LineBasicMaterial({
                    color: 0xff0000,
                    linewidth: 2
                });
                const line = new THREE.Line(lineGeo, lineMat);
                entityGroup.add(line);

                // 弦顶标记（黄色小球）
                const dot = new THREE.Mesh(
                    new THREE.SphereGeometry(0.6, 6, 6),
                    new THREE.MeshBasicMaterial({
                        color: 0xffff00
                    })
                );
                dot.position.copy(end);
                entityGroup.add(dot);
            }

            return g;
        }

        // ---- 创建目标 ----
        function createTarget(pos) {
            const g = new THREE.Group();
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(3, 2, 4),
                new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626 })
            );
            box.position.set(0, 1.5, 0);
            g.add(box);
            const marker = new THREE.Mesh(
                new THREE.SphereGeometry(0.8, 6, 6),
                new THREE.MeshBasicMaterial({ color: 0xef4444 })
            );
            marker.position.set(0, 3.5, 0);
            g.add(marker);
            g.position.copy(pos);
            entityGroup.add(g);
            return g;
        }

        // ---- 渲染场景帧 ----
        function renderFrame(data) {
            clearEntities();
            if (!data) return;

            // 1. 无人机
            const uavs = data.uva_state || data.uavs || [];
            uavs.forEach((u, i) => {
                const pos = new THREE.Vector3(u.position[0], u.position[1], u.position[2]);
                const color = (i === 0) ? 0x38bdf8 : 0xf0883e;
                createDrone(pos, color, `UAV${i}`);
            });

            // 2. 武器
            const w = data.weapon || data.weapon_data;
            if (w) {
                const wPos = w.position ? w.position : w;
                const pos = new THREE.Vector3(wPos[0], wPos[1], wPos[2]);
                let aimPos = null;
                if (w.aim_x !== undefined) {
                    aimPos = new THREE.Vector3(w.aim_x, w.aim_y || 0, w.aim_z || 0);
                } else if (w.top_project_position) {
                    aimPos = new THREE.Vector3(
                        w.top_project_position[0],
                        w.top_project_position[1],
                        w.top_project_position[2]
                    );
                }
                createWeapon(pos, aimPos);
            }

            // 3. 目标
            const t = data.target || data.target_point;
            if (t) {
                const tPos = t.position ? t.position : t;
                const pos = new THREE.Vector3(tPos[0], tPos[1], tPos[2]);
                createTarget(pos);
            }

            // 4. 子弹（橙色，与黄色弦顶区分）
            const bullets = data.bullets || [];
            bullets.forEach(b => {
                const pos = new THREE.Vector3(b.x, b.y || 0, b.z || 0);
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(0.8, 6, 6),
                    new THREE.MeshBasicMaterial({ color: 0xff8800 })
                );
                sphere.position.copy(pos);
                bulletGroup.add(sphere);
            });
        }

        // =============================================
        // 2. 回放控制器（不变）
        // =============================================
        let fullData = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;
        let speed = 1;

        const timeline = document.getElementById('timeline');
        const stepLabel = document.getElementById('step-label');
        const playBtn = document.getElementById('play-btn');
        const resetBtn = document.getElementById('reset-btn');
        const speedSelect = document.getElementById('speed-select');
        const frameInfo = document.getElementById('frame-info');

        function goToStep(idx) {
            if (!fullData.length || idx < 0 || idx >= fullData.length) return;
            currentIndex = idx;
            renderFrame(fullData[idx]);
            timeline.value = idx;
            stepLabel.textContent = `${idx} / ${fullData.length-1}`;
            frameInfo.textContent = `步数: ${fullData.length}`;
        }

        function startPlayback() {
            if (!fullData.length) return;
            if (currentIndex >= fullData.length-1) goToStep(0);
            isPlaying = true;
            playBtn.textContent = '⏸';
            clearInterval(playTimer);
            playTimer = setInterval(() => {
                if (currentIndex < fullData.length-1) goToStep(currentIndex+1);
                else stopPlayback();
            }, Math.max(50, 100 / speed));
        }

        function stopPlayback() {
            isPlaying = false;
            playBtn.textContent = '▶';
            clearInterval(playTimer);
        }

        playBtn.addEventListener('click', () => isPlaying ? stopPlayback() : startPlayback());
        resetBtn.addEventListener('click', () => { stopPlayback(); if(fullData.length) goToStep(0); });
        timeline.addEventListener('input', () => { if(isPlaying) stopPlayback(); goToStep(parseInt(timeline.value)); });
        speedSelect.addEventListener('change', () => {
            speed = parseFloat(speedSelect.value);
            if(isPlaying) { stopPlayback(); startPlayback(); }
        });

        // =============================================
        // 3. 文件加载
        // =============================================
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const logDiv = document.getElementById('log');

        function log(msg) {
            logDiv.style.display = 'block';
            logDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            console.log(msg);
        }

        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            log(`读取文件: ${file.name}`);
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    log(`JSON 解析成功`);
                    if (Array.isArray(data)) {
                        fullData = data;
                    } else if (data.episode_data && Array.isArray(data.episode_data)) {
                        fullData = data.episode_data;
                    } else {
                        fullData = [data];
                    }
                    if (fullData.length === 0) { log('数据为空'); return; }
                    log(`加载 ${fullData.length} 步数据`);
                    timeline.max = fullData.length - 1;
                    timeline.value = 0;
                    document.getElementById('controls').style.display = 'flex';
                    goToStep(0);
                    log('✅ 数据加载成功');
                } catch(err) {
                    log('❌ JSON 解析失败: ' + err.message);
                    alert('解析失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        // =============================================
        // 4. 窗口自适应 & 动画循环
        // =============================================
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // =============================================
        // 5. 模拟数据（修正高度，使场景可见）
        // =============================================
        function generateMockData() {
            const steps = 30;
            const data = [];
            for (let i=0; i<steps; i++) {
                const t = i * 0.1;
                data.push({
                    _episode_steps: i,
                    uva_state: [
                        { position: [20 + i*0.8, 15 + Math.sin(i*0.2)*8, 20 + Math.sin(i*0.15)*4], velocity: [5,0,1], id: 'UAV-001' },
                        { position: [-20 + i*0.5, 10 + Math.cos(i*0.25)*10, 30 + Math.cos(i*0.1)*6], velocity: [-3,0,0.5], id: 'UAV-002' }
                    ],
                    weapon: {
                        position: [-40, 0, -40],   // 高度改为 0（地面）
                        state: Math.floor(i/8)%3,
                        tuning_time: Math.max(0, 1.5 - i*0.04),
                        aim_x: -40 + Math.sin(i*0.08)*25,
                        aim_y: 2 + Math.sin(i*0.1)*1.5,   // 瞄准点高度在 0.5~3.5 之间变化
                        aim_z: -40 + Math.cos(i*0.08)*25
                    },
                    target: { position: [30, 0, -30] },   // 高度 0
                    bullets: (i % 5 === 0) ? [{ x: -40 + Math.sin(i*0.08)*25*0.4, y: 1, z: -40 + Math.cos(i*0.08)*25*0.4 }] : []
                });
            }
            return data;
        }

        setTimeout(() => {
            const mock = generateMockData();
            fullData = mock;
            timeline.max = fullData.length - 1;
            document.getElementById('controls').style.display = 'flex';
            goToStep(0);
            log('📊 已加载模拟数据（30步，武器高度0，目标高度0）');
        }, 500);

        console.log('✅ 系统已启动（武器/目标在地面，红色=炮口指向，黄色=弦顶，橙色=子弹）');
    </script>
</body>
</html>
