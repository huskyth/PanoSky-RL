<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV 突防回放系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 12px 24px; border-radius: 12px; display: flex; align-items: center; gap: 16px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8; }
        #controls button { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
        #controls button:hover { background: rgba(56, 189, 248, 0.2); }
        #controls input[type="range"] { width: 300px; }
        #file-btn { position: absolute; top: 20px; right: 20px; z-index: 20; padding: 8px 16px; background: #0ea5e9; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        #file-btn:hover { background: #0284c7; }
        #file-input { display: none; }
        #log { position: absolute; bottom: 100px; left: 20px; z-index: 20; background: rgba(0,0,0,0.7); color: #0f0; padding: 8px; font-size: 12px; max-height: 150px; overflow-y: auto; width: 300px; border-radius: 4px; font-family: monospace; display: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <button id="file-btn">📂 加载 JSON</button>
    <input type="file" id="file-input" accept=".json">
    <div id="controls">
        <button id="play-btn">▶</button>
        <button id="reset-btn">⏮</button>
        <span id="step-label">0 / 0</span>
        <input type="range" id="timeline" min="0" max="0" value="0">
        <select id="speed-select"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option></select>
        <span id="frame-info">步数: 0</span>
    </div>
    <div id="log"></div>

    <script>
        // =============================================
        // 1. Three.js 场景初始化（含地形）
        // =============================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.Fog(0x0f172a, 200, 800);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
        camera.position.set(120, 80, 120);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0, 0);
        controls.update();

        // 灯光
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // ---- 地形（永久保留） ----
        const terrainGroup = new THREE.Group();
        scene.add(terrainGroup);

        function buildTerrain() {
            // 清除旧地形
            while(terrainGroup.children.length) {
                const child = terrainGroup.children[0];
                terrainGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
            const size = 300, seg = 100;
            const geo = new THREE.PlaneGeometry(size, size, seg, seg);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const h = Math.sin(x*0.03)*10 + Math.cos(y*0.03)*10 + Math.sin(x*0.08+y*0.05)*5 + (Math.random()-0.5)*1;
                pos.setZ(i, h);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, flatShading: true, roughness: 0.8 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI/2;
            mesh.position.y = -2;
            mesh.receiveShadow = true;
            terrainGroup.add(mesh);
            // 线框
            const wire = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.05 }));
            wire.rotation.x = -Math.PI/2;
            wire.position.y = -1.8;
            terrainGroup.add(wire);
        }
        buildTerrain();

        // ---- 坐标轴 ----
        const axes = new THREE.AxesHelper(50);
        scene.add(axes);

        // ---- 动态实体 ----
        const entityGroup = new THREE.Group();
        scene.add(entityGroup);
        let entities = { drones: [], weapons: [], targets: [] };

        // ---- 工具：创建无人机 ----
        function createDrone(pos, color, label) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.3 }));
            g.add(body);
            // 螺旋桨
            for (let i=0; i<4; i++) {
                const prop = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                prop.position.set(Math.cos(i*Math.PI/2)*2.2, 1.5, Math.sin(i*Math.PI/2)*2.2);
                prop.userData.rotSpeed = 0.2 + Math.random()*0.1;
                g.add(prop);
            }
            g.position.copy(pos);
            entityGroup.add(g);
            return g;
        }

        function createWeapon(pos) {
            const g = new THREE.Group();
            const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 1.5, 6), new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.1 }));
            base.position.y = 1;
            g.add(base);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 4, 6), new THREE.MeshStandardMaterial({ color: 0x475569 }));
            barrel.rotation.x = Math.PI/2;
            barrel.position.set(0, 2, 3);
            g.add(barrel);
            g.position.copy(pos);
            entityGroup.add(g);
            return g;
        }

        function createTarget(pos) {
            const g = new THREE.Group();
            const box = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 4), new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626 }));
            box.position.y = 1.5;
            g.add(box);
            const marker = new THREE.Mesh(new THREE.SphereGeometry(0.8, 6, 6), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            marker.position.y = 3.5;
            g.add(marker);
            g.position.copy(pos);
            entityGroup.add(g);
            return g;
        }

        // ---- 辅助：清除实体 ----
        function clearEntities() {
            while(entityGroup.children.length) {
                const child = entityGroup.children[0];
                entityGroup.remove(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) child.material.dispose();
            }
            entities = { drones: [], weapons: [], targets: [] };
        }

        // ---- 渲染场景帧 ----
        function renderFrame(data) {
            clearEntities();
            if (!data) return;
            // 无人机
            const uavs = data.uva_state || data.uavs || [];
            uavs.forEach((u, i) => {
                const pos = new THREE.Vector3(u.position[0], u.position[2] || 10, u.position[1]);
                const color = (i===0) ? 0x38bdf8 : 0xf0883e;
                const g = createDrone(pos, color, `UAV${i}`);
                // 存储引用以便后续更新（此处简化）
            });
            // 武器
            const w = data.weapon || data.weapon_data;
            if (w) {
                const pos = new THREE.Vector3(w.position ? w.position[0] : w[0], w.position ? w.position[2] : w[2], w.position ? w.position[1] : w[1]);
                createWeapon(pos);
                // 瞄准线
                if (w.aim_x !== undefined) {
                    const start = pos.clone();
                    const end = new THREE.Vector3(w.aim_x, w.aim_z || 0, w.aim_y || 0);
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
                    const line = new THREE.Line(lineGeo, lineMat);
                    entityGroup.add(line);
                }
            }
            // 目标
            const t = data.target || data.target_point;
            if (t) {
                const pos = new THREE.Vector3(t.position ? t.position[0] : t[0], t.position ? t.position[2] : t[2], t.position ? t.position[1] : t[1]);
                createTarget(pos);
            }
        }

        // =============================================
        // 2. 回放控制器
        // =============================================
        let fullData = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;
        let speed = 1;

        const timeline = document.getElementById('timeline');
        const stepLabel = document.getElementById('step-label');
        const playBtn = document.getElementById('play-btn');
        const resetBtn = document.getElementById('reset-btn');
        const speedSelect = document.getElementById('speed-select');
        const frameInfo = document.getElementById('frame-info');

        function goToStep(idx) {
            if (!fullData.length || idx < 0 || idx >= fullData.length) return;
            currentIndex = idx;
            renderFrame(fullData[idx]);
            timeline.value = idx;
            stepLabel.textContent = `${idx} / ${fullData.length-1}`;
            frameInfo.textContent = `步数: ${fullData.length}`;
        }

        function startPlayback() {
            if (!fullData.length) return;
            if (currentIndex >= fullData.length-1) goToStep(0);
            isPlaying = true;
            playBtn.textContent = '⏸';
            clearInterval(playTimer);
            playTimer = setInterval(() => {
                if (currentIndex < fullData.length-1) goToStep(currentIndex+1);
                else stopPlayback();
            }, Math.max(50, 100 / speed));
        }

        function stopPlayback() {
            isPlaying = false;
            playBtn.textContent = '▶';
            clearInterval(playTimer);
        }

        // 事件绑定
        playBtn.addEventListener('click', () => isPlaying ? stopPlayback() : startPlayback());
        resetBtn.addEventListener('click', () => { stopPlayback(); if(fullData.length) goToStep(0); });
        timeline.addEventListener('input', () => { if(isPlaying) stopPlayback(); goToStep(parseInt(timeline.value)); });
        speedSelect.addEventListener('change', () => {
            speed = parseFloat(speedSelect.value);
            if(isPlaying) { stopPlayback(); startPlayback(); }
        });

        // =============================================
        // 3. 文件加载
        // =============================================
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const logDiv = document.getElementById('log');

        function log(msg) {
            logDiv.style.display = 'block';
            logDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            console.log(msg);
        }

        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            log(`读取文件: ${file.name}`);
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    log(`JSON 解析成功，类型: ${Array.isArray(data) ? '数组' : '对象'}`);
                    // 处理数据
                    if (Array.isArray(data)) {
                        fullData = data;
                    } else if (data.episode_data && Array.isArray(data.episode_data)) {
                        fullData = data.episode_data;
                    } else {
                        // 单帧，转为数组
                        fullData = [data];
                    }
                    if (fullData.length === 0) { log('数据为空'); return; }
                    log(`加载 ${fullData.length} 步数据`);
                    // 启用回放
                    timeline.max = fullData.length - 1;
                    timeline.value = 0;
                    goToStep(0);
                    document.getElementById('controls').style.display = 'flex';
                    log('✅ 数据加载成功，开始回放');
                } catch(err) {
                    log('❌ JSON 解析失败: ' + err.message);
                    alert('解析失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            this.value = ''; // 允许重复选择
        });

        // =============================================
        // 4. 窗口自适应 & 动画循环
        // =============================================
        window.addEventListener('resize', () => {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w/h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 初始加载一些模拟数据方便测试
        function generateMockData() {
            const steps = 30;
            const data = [];
            for (let i=0; i<steps; i++) {
                const t = i * 0.1;
                data.push({
                    _episode_steps: i,
                    uva_state: [
                        { position: [20 + i*0.8, 15 + Math.sin(i*0.2)*8, 20 + Math.sin(i*0.15)*4], velocity: [5,0,1], id: 'UAV-001' },
                        { position: [-20 + i*0.5, -10 + Math.cos(i*0.25)*10, 30 + Math.cos(i*0.1)*6], velocity: [-3,0,0.5], id: 'UAV-002' }
                    ],
                    weapon: { position: [-50, -50, 0], state: Math.floor(i/8)%3, tuning_time: Math.max(0, 1.5 - i*0.04), aim_x: -50 + Math.sin(i*0.08)*25, aim_y: 0, aim_z: -50 + Math.cos(i*0.08)*25 },
                    target: { position: [30, -30, 0] }
                });
            }
            return data;
        }

        // 自动加载模拟数据
        setTimeout(() => {
            const mock = generateMockData();
            fullData = mock;
            timeline.max = fullData.length - 1;
            goToStep(0);
            document.getElementById('controls').style.display = 'flex';
            log('📊 已加载模拟数据（30步），点击「加载JSON」可替换');
        }, 500);

        console.log('✅ 系统已启动，点击右上角按钮加载您的训练 JSON 文件');
    </script>
</body>
</html>
