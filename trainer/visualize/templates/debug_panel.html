<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>无人机突防 - 训练数据回放器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background: #161b22;
            padding: 16px;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #sidebar h3 { font-size: 14px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        #main { flex: 1; display: flex; flex-direction: column; background: #0d1117; }
        #canvas-wrapper { flex: 1; padding: 16px; display: flex; align-items: center; justify-content: center; background: #0d1117; }
        #gameCanvas { background: #161b22; border-radius: 8px; width: 100%; height: 100%; max-width: 800px; max-height: 800px; }
        #controls {
            padding: 12px 20px;
            background: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        #controls button, #controls input[type="file"] {
            background: #238636;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        #controls button:hover { background: #2ea043; }
        #controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #controls input[type="range"] { width: 200px; background: #30363d; height: 4px; }
        #controls .info-text { font-size: 13px; color: #8b949e; }
        #step-info { font-size: 13px; color: #f0f6fc; font-weight: bold; }
        #status-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        .status-item { display: flex; justify-content: space-between; border-bottom: 1px solid #21262d; padding: 2px 0; }
        .status-label { color: #8b949e; }
        .status-value { font-weight: bold; }
        .badge { padding: 1px 8px; border-radius: 10px; font-size: 11px; }
        .badge-fire { background: #da3633; color: white; }
        .badge-tune { background: #d29922; color: black; }
        .badge-capture { background: #1f6feb; color: white; }
        .badge-normal { background: #238636; color: white; }
        .file-label {
            background: #1f6feb;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: inline-block;
        }
        .file-label:hover { background: #388bfd; }
        #file-input { display: none; }
        #reward-chart-mini { background: #0d1117; border-radius: 4px; padding: 4px; width: 100%; height: 60px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>📁 数据加载</h3>
    <label class="file-label" for="file-input">📂 选择 JSON 文件</label>
    <input type="file" id="file-input" accept=".json">
    <div id="file-info" style="font-size:12px; color:#8b949e; word-break:break-all;">未加载文件</div>

    <h3 style="margin-top:8px;">📊 当前步骤</h3>
    <div style="display:flex; gap:8px; align-items:center;">
        <input type="range" id="slider" min="0" max="0" value="0" style="flex:1;">
        <span id="step-display" style="font-size:14px; min-width:50px;">0</span>
    </div>

    <h3>🎯 状态面板</h3>
    <div id="status-panel">
        <div class="status-item"><span class="status-label">武器状态</span><span class="status-value" id="s-weapon">-</span></div>
        <div class="status-item"><span class="status-label">锁定目标</span><span class="status-value" id="s-target">-</span></div>
        <div class="status-item"><span class="status-label">调弦剩余</span><span class="status-value" id="s-tuning">-</span></div>
        <div class="status-item"><span class="status-label">UAV0 奖励</span><span class="status-value" id="s-r0">-</span></div>
        <div class="status-item"><span class="status-label">UAV1 奖励</span><span class="status-value" id="s-r1">-</span></div>
        <div class="status-item"><span class="status-label">任务成功</span><span class="status-value" id="s-success">-</span></div>
    </div>

    <h3>📈 奖励曲线</h3>
    <canvas id="reward-chart-mini"></canvas>

    <div style="margin-top:auto; font-size:11px; color:#30363d; border-top:1px solid #21262d; padding-top:8px;">
        拖动滑块 ⏪ 回放训练过程
    </div>
</div>

<div id="main">
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
    </div>
    <div id="controls">
        <button id="btn-play">▶ 播放</button>
        <button id="btn-reset">⏮ 重置</button>
        <span id="step-info">步数: 0 / 0</span>
        <span class="info-text">⏱ 速度:</span>
        <select id="speed-select" style="background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:2px 6px;">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
        </select>
        <div style="margin-left:auto; font-size:12px; color:#8b949e;">拖入文件或点击加载</div>
    </div>
</div>

<script>
// ============================================================
// 核心：数据加载与回放
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('slider');
const stepDisplay = document.getElementById('step-display');
const fileInput = document.getElementById('file-input');
const fileInfo = document.getElementById('file-info');

let data = [];
let currentIndex = 0;
let isPlaying = false;
let playTimer = null;
let speed = 1;

// 获取 canvas 实际尺寸
function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const size = Math.min(rect.width, rect.height) * 0.95;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

// 加载 JSON 文件
fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            data = JSON.parse(ev.target.result);
            fileInfo.textContent = `✅ ${file.name} (${data.length} steps)`;
            if (data.length === 0) return;
            slider.max = data.length - 1;
            slider.value = 0;
            currentIndex = 0;
            renderStep(0);
            drawRewardChart(data);
        } catch (err) {
            alert('解析 JSON 失败: ' + err.message);
        }
    };
    reader.readAsText(file);
});

// 渲染指定步骤
function renderStep(index) {
    if (!data || data.length === 0 || index < 0 || index >= data.length) return;
    const d = data[index];
    currentIndex = index;
    stepDisplay.textContent = index;
    slider.value = index;

    // 更新画布
    drawCanvas(d);

    // 更新状态面板
    const wState = d.weapon?.state ?? 0;
    const stateMap = ['NORMAL', 'TUNING', 'CAPTURE', 'FIRE', 'RELOAD'];
    const badgeMap = ['badge-normal', 'badge-tune', 'badge-capture', 'badge-fire', 'badge-normal'];
    document.getElementById('s-weapon').innerHTML = `<span class="badge ${badgeMap[wState] || 'badge-normal'}">${stateMap[wState] || 'UNKNOWN'}</span>`;

    const targetIdx = d.uavs?.findIndex(u => u.is_targeted === true) ?? -1;
    document.getElementById('s-target').textContent = targetIdx >= 0 ? `UAV${targetIdx}` : 'None';
    document.getElementById('s-tuning').textContent = (d.weapon?.tuning_time ?? 0).toFixed(1) + 's';

    const r = d.reward || [0, 0];
    document.getElementById('s-r0').textContent = r[0]?.toFixed(3) ?? '0';
    document.getElementById('s-r1').textContent = r[1]?.toFixed(3) ?? '0';

    const isSuccess = d.reward && (d.reward[0] > 50 || d.reward[1] > 50);
    document.getElementById('s-success').textContent = isSuccess ? '✅ 成功' : '⏳ 进行中';
    document.getElementById('s-success').style.color = isSuccess ? '#2ea043' : '#8b949e';
}

// 绘制 Canvas（2D 物理视图 + 炮口方向）
function drawCanvas(d) {
    const w = 800, h = 800;
    ctx.clearRect(0, 0, w, h);

    // 背景与网格
    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#21262d';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 10; i++) {
        const x = 40 + i * 72;
        ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x, 760); ctx.stroke();
        const y = 40 + i * 72;
        ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(760, y); ctx.stroke();
    }

    function toX(px) { return 40 + (px / 1000) * 720; }
    function toY(py) { return 760 - (py / 1000) * 720; }

    // 目标点
    if (d.target) {
        const tx = toX(d.target[0]), ty = toY(d.target[1]);
        ctx.beginPath();
        ctx.arc(tx, ty, 12, 0, 2*Math.PI);
        ctx.fillStyle = '#d29922';
        ctx.shadowColor = '#d29922'; ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#e6edf3';
        ctx.font = '12px sans-serif';
        ctx.fillText('🎯', tx - 8, ty - 18);
    }

    // 武器位置 & 炮口方向
    if (d.weapon) {
        const wx = toX(d.weapon.position[0]), wy = toY(d.weapon.position[1]);
        ctx.beginPath();
        ctx.arc(wx, wy, 16, 0, 2*Math.PI);
        ctx.fillStyle = '#1f6feb';
        ctx.fill();
        ctx.fillStyle = '#e6edf3';
        ctx.font = '11px sans-serif';
        ctx.fillText('⚔️', wx - 8, wy - 22);

        // 炮口指向线（调弦方向）
        if (d.weapon.top_project_position) {
            const gx = toX(d.weapon.top_project_position[0]);
            const gy = toY(d.weapon.top_project_position[1]);
            ctx.beginPath();
            ctx.moveTo(wx, wy);
            ctx.lineTo(gx, gy);
            ctx.strokeStyle = '#f0883e';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
            // 炮口末端小圆
            ctx.beginPath();
            ctx.arc(gx, gy, 5, 0, 2*Math.PI);
            ctx.fillStyle = '#f0883e';
            ctx.fill();
        }
        // 武器标签
        ctx.fillStyle = '#8b949e'; ctx.font = '10px sans-serif';
        ctx.fillText('武器', wx - 14, wy + 34);
    }

    // 无人机
    if (d.uavs) {
        d.uavs.forEach((u, i) => {
            const ux = toX(u.position[0]), uy = toY(u.position[1]);
            const isDecoy = (i === 0);
            const color = isDecoy ? '#58a6ff' : '#f0883e';

            // 机身
            ctx.shadowColor = color; ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(ux, uy, 12, 0, 2*Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 被瞄准光环
            if (u.is_targeted) {
                ctx.beginPath();
                ctx.arc(ux, uy, 18, 0, 2*Math.PI);
                ctx.strokeStyle = '#da3633';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            // 速度箭头
            if (u.velocity && (Math.abs(u.velocity[0]) > 0.1 || Math.abs(u.velocity[1]) > 0.1)) {
                const scale = 0.3;
                ctx.beginPath();
                ctx.moveTo(ux, uy);
                ctx.lineTo(ux + u.velocity[0]*scale, uy - u.velocity[1]*scale);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            // 标签
            ctx.fillStyle = '#e6edf3';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(`UAV${i} ${isDecoy ? '🛡️' : '⚡'}`, ux - 20, uy - 20);
            // 距离信息
            ctx.fillStyle = '#8b949e'; ctx.font = '9px sans-serif';
            if (u.dist_to_weapon !== undefined) {
                ctx.fillText(`${u.dist_to_weapon.toFixed(0)}m`, ux - 16, uy + 26);
            }
        });
    }

    // 图例
    ctx.fillStyle = '#8b949e'; ctx.font = '10px sans-serif';
    ctx.fillText('🟦 诱饵', 50, 30);
    ctx.fillText('🟧 刺客', 150, 30);
    ctx.fillText('🟡 目标点', 250, 30);
    ctx.fillText('🟠 炮口指向', 350, 30);
    ctx.fillStyle = '#30363d';
    ctx.fillText(`步: ${currentIndex} / ${data?.length || 0}`, 700, 30);
}

// 奖励曲线
function drawRewardChart(data) {
    const c = document.getElementById('reward-chart-mini');
    const ctxc = c.getContext('2d');
    const W = c.width, H = c.height;
    ctxc.clearRect(0, 0, W, H);
    ctxc.fillStyle = '#0d1117';
    ctxc.fillRect(0, 0, W, H);

    if (!data || data.length < 2) return;
    const step = 1;
    const range = Math.min(500, data.length);
    const start = Math.max(0, data.length - range);
    const vals0 = [], vals1 = [];
    for (let i = start; i < data.length; i += step) {
        const r = data[i].reward || [0, 0];
        vals0.push(r[0] || 0);
        vals1.push(r[1] || 0);
    }
    if (vals0.length < 2) return;
    const maxV = Math.max(2, ...vals0, ...vals1);

    ctxc.strokeStyle = '#58a6ff'; ctxc.lineWidth = 1.5;
    ctxc.beginPath();
    for (let i=0; i<vals0.length; i++) {
        const x = (i / (vals0.length-1)) * W;
        const y = H/2 - (vals0[i] / maxV) * (H/2 - 2);
        i===0 ? ctxc.moveTo(x, y) : ctxc.lineTo(x, y);
    }
    ctxc.stroke();

    ctxc.strokeStyle = '#f0883e'; ctxc.lineWidth = 1.5;
    ctxc.beginPath();
    for (let i=0; i<vals1.length; i++) {
        const x = (i / (vals1.length-1)) * W;
        const y = H/2 - (vals1[i] / maxV) * (H/2 - 2);
        i===0 ? ctxc.moveTo(x, y) : ctxc.lineTo(x, y);
    }
    ctxc.stroke();

    ctxc.fillStyle = '#8b949e'; ctxc.font = '8px sans-serif';
    ctxc.fillText('蓝=UAV0 橙=UAV1', 4, 10);
}

// 滑块控制
slider.addEventListener('input', function() {
    if (isPlaying) { stopPlay(); }
    renderStep(parseInt(this.value));
});

// 播放控制
document.getElementById('btn-play').addEventListener('click', function() {
    if (isPlaying) { stopPlay(); } else { startPlay(); }
});

function startPlay() {
    if (!data || data.length === 0) return;
    if (currentIndex >= data.length - 1) { currentIndex = 0; slider.value = 0; }
    isPlaying = true;
    document.getElementById('btn-play').textContent = '⏸ 暂停';
    speed = parseFloat(document.getElementById('speed-select').value);
    const interval = 100 / speed;
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => {
        if (currentIndex < data.length - 1) {
            currentIndex++;
            renderStep(currentIndex);
        } else {
            stopPlay();
        }
    }, interval);
}

function stopPlay() {
    isPlaying = false;
    document.getElementById('btn-play').textContent = '▶ 播放';
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

document.getElementById('btn-reset').addEventListener('click', function() {
    stopPlay();
    if (data && data.length > 0) {
        currentIndex = 0;
        renderStep(0);
    }
});

document.getElementById('speed-select').addEventListener('change', function() {
    speed = parseFloat(this.value);
    if (isPlaying) {
        // 重启播放器以应用新速度
        const idx = currentIndex;
        stopPlay();
        currentIndex = idx;
        startPlay();
    }
});

// 拖拽上传
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.json')) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
    }
});

// 初始化
resizeCanvas();
</script>
</body>
</html>
